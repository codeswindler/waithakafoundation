# Nginx site for waithakafoundation.org -> Node app on 127.0.0.1:3460 (run by PM2).
# Install:  sudo cp deploy/nginx-waithakafoundation.conf /etc/nginx/sites-available/waithakafoundation
#           sudo ln -s /etc/nginx/sites-available/waithakafoundation /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d waithakafoundation.org -d www.waithakafoundation.org
# Certbot adds the HTTPS (443) block and the http->https redirect automatically.

upstream waithaka_app {
    server 127.0.0.1:3460;
    keepalive 16;
}

# www -> bare domain
server {
    listen 80;
    listen [::]:80;
    server_name www.waithakafoundation.org;
    return 301 $scheme://waithakafoundation.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name waithakafoundation.org;

    # Large enough for video uploads from the admin panel (app limit is MAX_VIDEO_MB, default 300).
    client_max_body_size 320m;
    client_body_timeout 300s;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/calendar;

    # Uploaded photos/videos: served straight from disk by Nginx (fast, supports video seeking).
    # Adjust the path if the app lives elsewhere.
    location /uploads/ {
        alias /var/www/waithakafoundation/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        location ~ /uploads/tmp/ { deny all; }
    }

    location / {
        proxy_pass http://waithaka_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off; # stream uploads to the app so the progress bar is accurate
    }
}
